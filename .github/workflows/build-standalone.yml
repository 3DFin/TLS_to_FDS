name: build standalone application

on:
  push:
    branches: [ main, Refactoring ]
    tags:
      - v*
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-standalone-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build standalone TLS_to_FDS (${{ matrix.target_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target_name: Windows
            artifact_name: TLS_to_FDS-Windows
            dist_files: |
              dist/TLS_to_FDS_Windows.zip
              dist/TLS_to_FDS/TLS_to_FDS.exe
          - os: ubuntu-latest
            target_name: Linux
            artifact_name: TLS_to_FDS-Linux
            dist_files: |
              dist/TLS_to_FDS_Linux.tar.gz
          - os: macos-latest
            target_name: macOS-AppleSilicon
            artifact_name: TLS_to_FDS-macOS-AppleSilicon
            dist_files: |
              dist/TLS_to_FDS_macOS_AppleSilicon.dmg
              dist/TLS_to_FDS_macOS_AppleSilicon.zip
          - os: macos-15-intel
            target_name: macOS-Intel
            artifact_name: TLS_to_FDS-macOS-Intel
            dist_files: |
              dist/TLS_to_FDS_macOS_Intel.dmg
              dist/TLS_to_FDS_macOS_Intel.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -e .

      - name: Install Linux GUI Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0

      - name: Build standalone
        run: python build_exe.py

      - name: Compress Windows Distribution
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/TLS_to_FDS -DestinationPath dist/TLS_to_FDS_Windows.zip -Force

      - name: Compress Linux Distribution
        if: runner.os == 'Linux'
        run: |
          tar -czf dist/TLS_to_FDS_Linux.tar.gz -C dist TLS_to_FDS

      # Upload downloadable build artifacts for all workflow runs (PRs, commits, manual triggers)
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.dist_files }}
          retention-days: 14

      # Create releases if we push a version tag
      - name: Add to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: ${{ matrix.dist_files }}
